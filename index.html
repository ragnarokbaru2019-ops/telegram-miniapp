<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>Bakso Juragan</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>


<body>

<div class="container">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <div>

            <h1>
                🍜 Bakso Juragan
            </h1>

            <p>
                Bakso enak, siap diantar!
            </p>

        </div>

    </div>


    <!-- =====================================================
         MENU
    ====================================================== -->

    <div class="menu-title">

        <h2>
            Menu Kami
        </h2>

    </div>


    <!-- =====================================================
         BAKSO URAT
    ====================================================== -->

    <div class="product">

        <div class="product-icon">
            🍜
        </div>

        <div class="product-info">

            <h3>
                Bakso Urat
            </h3>

            <p>
                Bakso urat sapi yang lezat
            </p>

            <strong>
                $4
            </strong>

        </div>

        <div class="quantity">

            <button
                type="button"
                onclick="decrease('bakso_urat')"
            >
                −
            </button>

            <span id="qty-bakso_urat">
                0
            </span>

            <button
                type="button"
                onclick="increase('bakso_urat')"
            >
                +
            </button>

        </div>

    </div>


    <!-- =====================================================
         BAKSO TELUR
    ====================================================== -->

    <div class="product">

        <div class="product-icon">
            🥚
        </div>

        <div class="product-info">

            <h3>
                Bakso Telur
            </h3>

            <p>
                Bakso dengan isian telur
            </p>

            <strong>
                $4
            </strong>

        </div>

        <div class="quantity">

            <button
                type="button"
                onclick="decrease('bakso_telur')"
            >
                −
            </button>

            <span id="qty-bakso_telur">
                0
            </span>

            <button
                type="button"
                onclick="increase('bakso_telur')"
            >
                +
            </button>

        </div>

    </div>


    <!-- =====================================================
         MIE AYAM
    ====================================================== -->

    <div class="product">

        <div class="product-icon">
            🍗
        </div>

        <div class="product-info">

            <h3>
                Mie Ayam
            </h3>

            <p>
                Mie ayam gurih dan nikmat
            </p>

            <strong>
                $3
            </strong>

        </div>

        <div class="quantity">

            <button
                type="button"
                onclick="decrease('mie_ayam')"
            >
                −
            </button>

            <span id="qty-mie_ayam">
                0
            </span>

            <button
                type="button"
                onclick="increase('mie_ayam')"
            >
                +
            </button>

        </div>

    </div>


    <!-- =====================================================
         CART
    ====================================================== -->

    <div class="cart">

        <div class="cart-header">

            <h2>
                🛒 Keranjang
            </h2>

        </div>

        <div id="cart-items">

            <p class="empty">
                Keranjang masih kosong
            </p>

        </div>

        <div class="total">

            <span>
                Total
            </span>

            <strong id="total">
                $0
            </strong>

        </div>


        <!-- =================================================
             CHECKOUT
        ================================================== -->

        <button
            class="checkout"
            id="checkout-button"
            type="button"
        >
            🛒 LANJUT ORDER
        </button>

    </div>

</div>


<!-- =====================================================
     APP JS
====================================================== -->

<script src="app.js"></script>


<!-- =====================================================
     TELEGRAM WEB APP INIT
====================================================== -->

<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            if (
                window.Telegram &&
                window.Telegram.WebApp
            ) {

                const tg =
                    window.Telegram.WebApp;

                tg.ready();
                tg.expand();

                console.log(
                    "✅ Telegram WebApp READY"
                );

                console.log(
                    "📱 Telegram version:",
                    tg.version
                );

                console.log(
                    "👤 Telegram user:",
                    tg.initDataUnsafe?.user || null
                );

            } else {

                console.warn(
                    "⚠️ Telegram WebApp tidak terdeteksi"
                );

            }

        }
    );

</script>


</body>

</html>
