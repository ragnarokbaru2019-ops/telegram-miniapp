<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>Bakso Juragan</title>

    <link
        rel="stylesheet"
        href="style.css?v=20260818-02"
    >

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

</head>

<body>

<div class="container">

<!-- =====================================================
     HEADER
====================================================== -->

<div class="header">

    <img
        src="images/logo-bakso-juragan.png"
        alt="Bakso Juragan"
        class="header-logo"
    >

    <div class="header-info">

        <h1>
            Bakso Juragan
        </h1>

        <div
            class="online-status"
            id="online-status"
        >

            <span
                id="online-indicator"
                class="online-dot"
            ></span>

            <span id="online-text">
                CHECKING...
            </span>

        </div>

    </div>

</div>


<!-- =====================================================
     MENU
====================================================== -->

<div class="menu-title">

    <h2>
        Menu Kami
    </h2>

</div>


<!-- =====================================================
     CATEGORY
====================================================== -->

<div class="category-scroll">

    <button
        type="button"
        class="category-chip active"
        onclick="selectCategory('all')"
    >
        Semua
    </button>

    <button
        type="button"
        class="category-chip"
        onclick="selectCategory('bakso')"
    >
        Bakso
    </button>

    <button
        type="button"
        class="category-chip"
        onclick="selectCategory('mie')"
    >
        Mie Ayam
    </button>

    <button
        type="button"
        class="category-chip"
        onclick="selectCategory('minuman')"
    >
        Minuman
    </button>

</div>


<!-- PRODUCT LIST -->

<div id="product-list"></div>


<!-- =====================================================
     CART
====================================================== -->

<div class="cart">

    <div class="cart-header">

        <h2>
            🛒 Keranjang
        </h2>

    </div>


    <div id="cart-items">

        <p class="empty">
            Keranjang masih kosong
        </p>

    </div>

    
    <div class="total">

        <span>
            Total
        </span>

        <strong id="total">
            ฿0
        </strong>

    </div>


    <button
        class="checkout"
        id="checkout-button"
        type="button"
    >
        🛒 LANJUT ORDER
    </button>

</div>


<!-- =====================================================
     CHECKOUT
====================================================== -->

<div
    id="checkout-section"
    style="display:none;"
>

    <div class="cart">

        <h2>
            📦 Detail Pengantaran
        </h2>


        <!-- PAYMENT -->

        <div style="margin-top:20px;">

            <h3>
                💵 Metode Pembayaran
            </h3>


            <button
                type="button"
                class="payment-option"
                id="payment-cash"
                onclick="selectPayment('cash')"
            >
                💵 Cash
            </button>


            <button
                type="button"
                class="payment-option"
                id="payment-aba"
                onclick="selectPayment('aba')"
            >
                🦁 ABA / QR
            </button>

        </div>


        <!-- ADDRESS -->

        <div style="margin-top:20px;">

            <h3>
                📍 Alamat Pengantaran
            </h3>


            <textarea
                id="address"
                rows="4"
                placeholder="Contoh: Golden Crown Hotel, Poipet"
                style="
                    width:100%;
                    box-sizing:border-box;
                    padding:12px;
                    border-radius:10px;
                    border:1px solid #ccc;
                    font-size:16px;
                    resize:none;
                "
            ></textarea>

        </div>


        <!-- GPS -->

        <div style="margin-top:20px;">

            <h3>
                📍 Lokasi GPS
            </h3>


            <button
                type="button"
                id="gps-button"
                class="gps-button"
            >
                📍 GUNAKAN LOKASI SAYA
            </button>


            <div
                id="gps-status"
                class="gps-status"
            >
                Lokasi belum diambil
            </div>

        </div>


        <!-- CONFIRM -->

        <button
            type="button"
            id="confirm-order"
            class="checkout"
        >
            ✅ KONFIRMASI ORDER
        </button>


        <!-- BACK -->

        <button
            type="button"
            id="back-button"
            style="
                width:100%;
                margin-top:10px;
                padding:14px;
                border:none;
                border-radius:10px;
                background:#ddd;
                font-size:16px;
            "
        >
            ← KEMBALI KE MENU
        </button>

    </div>

</div>

</div>


<!-- =====================================================
     APP JS
====================================================== -->

<script src="app.js?v=20260818-02"></script>


<!-- =====================================================
     TELEGRAM INIT
====================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {

        if (
            window.Telegram &&
            window.Telegram.WebApp
        ) {

            const tg =
                window.Telegram.WebApp;

            tg.ready();

            tg.expand();

            console.log(
                "✅ Telegram WebApp READY"
            );

            console.log(
                "📱 Telegram version:",
                tg.version
            );

            console.log(
                "👤 Telegram user:",
                tg.initDataUnsafe?.user || null
            );

        } else {

            console.warn(
                "⚠️ Telegram WebApp tidak terdeteksi"
            );

        }

    }

);

</script>


<!-- =====================================================
     PILIH MIE MODAL
====================================================== -->

<div
    id="mie-choice-modal"
    class="mie-choice-modal"
>

    <div class="mie-choice-box">

        <div class="mie-choice-header">

            <h2 id="mie-choice-title">
                PILIH MIE
            </h2>


            <button
                type="button"
                onclick="closeMieChoice()"
                class="mie-close"
            >
                ✕
            </button>

        </div>


        <p class="mie-choice-subtitle">
            Pilih jenis mie untuk pesanan kamu
        </p>


        <button
            type="button"
            class="mie-choice-button"
            onclick="selectMieChoice('Mie Kuning')"
        >

            <span>🟡</span>

            <strong>
                Mie Kuning
            </strong>

        </button>


        <button
            type="button"
            class="mie-choice-button"
            onclick="selectMieChoice('Bihun')"
        >

            <span>⚪</span>

            <strong>
                Bihun
            </strong>

        </button>


        <button
            type="button"
            class="mie-choice-button"
            onclick="selectMieChoice('Campur')"
        >

            <span>🟠</span>

            <strong>
                Campur
            </strong>

        </button>


        <button
            type="button"
            class="mie-choice-button"
            onclick="selectMieChoice('Kosongan')"
        >

            <span>⭕</span>

            <strong>
                Kosongan
            </strong>

        </button>

    </div>

</div>

    <!-- =====================================================
     ITEM REQUEST / CATATAN MODAL
====================================================== -->

<div
    id="item-note-modal"
    class="item-note-modal"
>

    <div class="item-note-box">

        <!-- HEADER -->

        <div class="item-note-header">

            <h2>
                📝 Butuh Request?
            </h2>

            <button
                type="button"
                onclick="closeItemNote(false)"
                class="item-note-close"
            >
                ✕
            </button>

        </div>


        <!-- PRODUCT NAME -->

        <div
            id="item-note-product"
            class="item-note-product"
        >
            Bakso Urat
        </div>


        <!-- INPUT REQUEST -->

        <textarea
            id="item-note-input"
            rows="3"
            placeholder="Contoh: tanpa sayur, sambal dipisah, kuah sedikit..."
        ></textarea>


        <!-- BUTTON -->

        <div class="item-note-actions">

<button
    type="button"
    class="item-note-no"
    onclick="addItemWithoutNote()"
>
    ❌ TIDAK
</button>
        

            <button
                type="button"
                class="item-note-yes"
                onclick="saveItemNote()"
            >
                ✅ YA
            </button>

        </div>

    </div>

</div>
    

</body>

</html>
